name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, new ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_PUBLIC_SUPABASE_URL: ${{ secrets.VITE_PUBLIC_SUPABASE_URL }}
      VITE_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.VITE_PUBLIC_SUPABASE_ANON_KEY }}
      VITE_PUBLIC_TELEGRAM_BOT_TOKEN: ${{ secrets.VITE_PUBLIC_TELEGRAM_BOT_TOKEN }}
      VITE_PUBLIC_TELEGRAM_CHANNEL_ID: ${{ secrets.VITE_PUBLIC_TELEGRAM_CHANNEL_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Create env file
        run: |
          echo "VITE_PUBLIC_SUPABASE_URL=${{ secrets.VITE_PUBLIC_SUPABASE_URL }}" >> .env
          echo "VITE_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.VITE_PUBLIC_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_PUBLIC_TELEGRAM_BOT_TOKEN=${{ secrets.VITE_PUBLIC_TELEGRAM_BOT_TOKEN }}" >> .env
          echo "VITE_PUBLIC_TELEGRAM_CHANNEL_ID=${{ secrets.VITE_PUBLIC_TELEGRAM_CHANNEL_ID }}" >> .env
      - name: Build
        run: npm run build
      - name: Create .nojekyll file
        run: touch dist/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 